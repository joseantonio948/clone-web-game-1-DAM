<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAME</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <a href="#inicio">GAME</a>
        </div>
        <nav class="navi">
          <ul>
            <li><a href="#novedades">Novedades</a></li>
            <li><a href="#reservas">Reservas</a></li>
            <li><a href="#ofertas">Ofertas</a></li>
          </ul>
        </nav>
        <div class="users_actions">
          <form class="buscador">
            <input type="search" id="search" placeholder="Buscar" />
            <label for="search" class="lupita">🔍</label>
          </form>
          <div class="users">
            <a href="#inicio sesion">👤Iniciar sesión</a>
            <a href="#favoritos">⭐Favoritos</a>
            <a href="#carrito">🛒Carrito (0)</a>
          </div>
        </div>
      </div>
    </header>
    <main class="body">
      <div class="banner">
        <span class="oferta">EXCLUSIVO</span>
        <h1>MEJORES OFERTAS</h1>
        <p>CONSOLAS Y MANDOS</p>
        <a href="#promociones">PROMOCIONES</a>
      </div>
      <section class="barra_ventajas">
        <div class="Ventaja_1">🚚 Envio gratis</div>
        <div class="Ventaja_2">🏪 Recogida en tienda</div>
        <div class="Ventaja_3">💎 Puntos de socio</div>
        <div class="Ventaja_4">🔄️ Renovación</div>
      </section>
      <h2>DESTACADOS</h2>
      <div class="productos">
        <article class="tarjeta_juego">
          <span class="plataforma">PS5</span>
          <img
            src="https://www.google.com/imgres?q=mario%20y%20luigi%20partners%20in%20time&imgurl=https%3A%2F%2Fm.media-amazon.com%2Fimages%2FM%2FMV5BOTJkYTAyYzAtNmNkNy00YWQ3LWE5OWItMmIyYWM1ZDdmOTcxXkEyXkFqcGc%40._V1_.jpg&imgrefurl=https%3A%2F%2Fwww.imdb.com%2Fes%2Ftitle%2Ftt0484859%2Freleaseinfo%2F&docid=q6gAHRrJ0bNhzM&tbnid=kQfUDeSa9f5VbM&vet=12ahUKEwjR5NCqraCYAxU1uScCHb8JNzIQnPAOegQILhAA..i&w=600&h=900&hcb=2&ved=2ahUKEwjR5NCqraCYAxU1uScCHb8JNzIQnPAOegQILhAA"
            alt="Carátrula PIT"
          />
          <h3 Mario y luigi Partners in Time></h3>
          <p class="Precio">25€</p>
          <button class="añadir_carrito">Añadir al carrito 🛒</button>
        </article>
      </div>
      <script scr="script.js"></script>
    </main>
  </body>
</html>
